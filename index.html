<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/openscout-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenScout" />
    <!--
      These are the HOME page's tags, not generic ones: `/` is served straight
      from the filesystem, so it never reaches the per-URL pass in api/shell.ts.
      Every other path does, and has these replaced. Keep them in sync with
      DEFAULT_META in src/lib/page-meta.ts.
    -->
    <meta name="description" content="Live brackets, rankings, team records, world skills standings, and match video for every VEX Robotics event." />
    <link rel="canonical" href="https://openscout.ing/" />
    <meta property="og:site_name" content="OpenScout" />
    <meta property="og:title" content="OpenScout: scouting and analytics for VEX Robotics" />
    <meta property="og:description" content="Live brackets, rankings, team records, world skills standings, and match video for every VEX Robotics event." />
    <meta property="og:image" content="https://openscout.ing/openscout-mark.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://openscout.ing/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OpenScout: scouting and analytics for VEX Robotics" />
    <meta name="twitter:description" content="Live brackets, rankings, team records, world skills standings, and match video for every VEX Robotics event." />
    <meta name="twitter:image" content="https://openscout.ing/openscout-mark.png" />
    <title>OpenScout: scouting and analytics for VEX Robotics</title>
    <!--
      Site-level structured data. It rides on every page: the per-URL pass in
      server/htmlMeta.ts rewrites meta tags only, and leaves this alone.

      Sitelinks (the indented list of sections under a brand result) are chosen
      by Google, not declared here. This tells it what the site is and what its
      sections are; the ranking of those sections is what earns the ladder.

      NOTE: the CSP in vercel.json and server/index.ts pins a sha256 of this
      block. Editing it, whitespace included, means recomputing both hashes or
      the browser drops the tag.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://openscout.ing/#organization",
            "name": "OpenScout",
            "url": "https://openscout.ing/",
            "logo": "https://openscout.ing/openscout-mark.png",
            "parentOrganization": { "@type": "Organization", "name": "RoboSTEM Foundation" }
          },
          {
            "@type": "WebSite",
            "@id": "https://openscout.ing/#website",
            "name": "OpenScout",
            "url": "https://openscout.ing/",
            "description": "Live brackets, rankings, team records, world skills standings, and match video for every VEX Robotics event.",
            "publisher": { "@id": "https://openscout.ing/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "ItemList",
            "name": "OpenScout sections",
            "itemListElement": [
              {
                "@type": "SiteNavigationElement",
                "position": 1,
                "name": "Events",
                "description": "Browse VEX Robotics events by date, region, and program.",
                "url": "https://openscout.ing/events"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 2,
                "name": "Teams",
                "description": "Search VEX Robotics teams by number, name, or region.",
                "url": "https://openscout.ing/teams"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 3,
                "name": "Skills",
                "description": "Live VEX Robotics world skills standings.",
                "url": "https://openscout.ing/skills"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 4,
                "name": "Jumper",
                "description": "Jump straight to any match on an event livestream recording.",
                "url": "https://openscout.ing/jumper"
              }
            ]
          }
        ]
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('vex-theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
