<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stemScout</title>
    <script>
      // Apply the saved theme + UI skin before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('vex-theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.setAttribute('data-theme', 'dark');
        // vex-ui-style is JSON-stringified ("modern" / "classic"); substring test
        // tolerates the surrounding quotes.
        var u = localStorage.getItem('vex-ui-style');
        if (u && u.indexOf('modern') !== -1) document.documentElement.setAttribute('data-ui', 'modern');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
